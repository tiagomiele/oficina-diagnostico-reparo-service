apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-diagnostico-reparo-hpa
  namespace: oficina-diagnostico-reparo
  labels:
    app.kubernetes.io/name: oficina-diagnostico-reparo
    app.kubernetes.io/part-of: oficina-diagnostico-reparo-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-diagnostico-reparo
  minReplicas: 1
  maxReplicas: 3
  # Só CPU: a JVM não devolve memória ao sistema e deixaria o HPA preso no máximo.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
